<header class="header">
  <div class="logo">
    <div>
      <img src="https://cache.clinic.co/assets/img/logo.png" alt="logo"/>
    </div>
  </div>

  <!-- Mobile Menu Button -->
  <div class="mobile-menu-btn" (click)="toggleMenu()">
    <i class="fas fa-bars"></i>
  </div>

  <nav class="nav" [class.active]="isMenuOpen">
    <ul>
      <li *ngFor="let header of headers">
        <a [routerLink]="header.url"
           (click)="onClickLogout(header, $event)"
           [class.active]="isActive(header.url)">
          {{ header.name }}
          <span *ngIf="header.name === 'Thông báo'" class="notification-badge">{{ notificationBadge }}</span>
        </a>
      </li>
    </ul>
  </nav>
</header>
