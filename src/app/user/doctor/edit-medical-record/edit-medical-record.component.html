<div class="edit-record-container">
  <div class="header">
    <h2>Chỉnh sửa hồ sơ bệnh án</h2>
    <div class="patient-info">
      <span class="patient-name">{{record.patientName}}</span>
      <span class="patient-id">ID: {{record.id}}</span>
    </div>
  </div>

  <form class="medical-record-form">
    <div class="form-section">
      <h3>Thông tin cá nhân</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Tuổi</label>
          <input type="number" [(ngModel)]="record.age" name="age" />
        </div>
        <div class="form-group">
          <label>Giới tính</label>
          <input type="text" [(ngModel)]="record.gender" name="gender" />
        </div>
        <div class="form-group">
          <label>Địa chỉ</label>
          <input type="text" [(ngModel)]="record.address" name="address" />
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" [(ngModel)]="record.phone" name="phone" />
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>Thông tin khám bệnh</h3>
      <div class="form-group">
        <label>Triệu chứng</label>
        <textarea [(ngModel)]="record.symptoms" name="symptoms" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Chẩn đoán</label>
        <textarea [(ngModel)]="record.diagnosis" name="diagnosis" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Phương pháp điều trị</label>
        <textarea [(ngModel)]="record.treatment" name="treatment" rows="2"></textarea>
      </div>
    </div>

    <div class="form-section">
      <h3>Thuốc điều trị</h3>
      <div class="medications-list">
        <div class="medication-item" *ngFor="let med of record.medications; let i = index">
          <span>{{med}}</span>
          <button type="button" class="remove-button" (click)="removeMedication(i)">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <div class="add-medication">
        <input 
          type="text" 
          [(ngModel)]="newMedication" 
          name="newMedication"
          placeholder="Thêm thuốc mới..."
        />
        <button type="button" (click)="addMedication()">Thêm</button>
      </div>
    </div>

    <div class="form-section">
      <h3>Ghi chú và lịch tái khám</h3>
      <div class="form-group">
        <label>Ghi chú</label>
        <textarea [(ngModel)]="record.notes" name="notes" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Lịch tái khám</label>
        <input type="date" [(ngModel)]="record.nextAppointment" name="nextAppointment" />
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="cancel-button" (click)="cancel()">Hủy</button>
      <button type="button" class="save-button" (click)="saveRecord()">Lưu thay đổi</button>
    </div>
  </form>
</div>
