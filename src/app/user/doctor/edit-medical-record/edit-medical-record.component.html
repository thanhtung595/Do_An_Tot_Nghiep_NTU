<div class="edit-medical-record-container">
  <div class="header">
    <h2>Chỉnh sửa hồ sơ bệnh án</h2>
    <div class="actions">
      <button class="btn btn-secondary" (click)="backPatientHistory()">
        <i class="fas fa-arrow-left"></i> Quay lại
      </button>
      <button class="btn btn-primary" (click)="saveMedicalRecord()">
        <i class="fas fa-save"></i> Lưu thay đổi
      </button>
    </div>
  </div>

  <div class="content">
    <div class="form-section">
      <h3>Thông tin bệnh nhân</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Tên bệnh nhân</label>
          <input type="text" [(ngModel)]="medicalRecord.patientname" readonly>
        </div>
        <div class="form-group">
          <label>Ngày khám</label>
          <input type="date" [(ngModel)]="medicalRecord.date" readonly>
        </div>
        <div class="form-group">
          <label>Giờ khám</label>
          <input type="time" [(ngModel)]="medicalRecord.time" readonly>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>Thông tin khám bệnh</h3>
      <div class="form-group">
        <label>Triệu chứng</label>
        <textarea [(ngModel)]="medicalRecord.symptom" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Chẩn đoán</label>
        <textarea [(ngModel)]="medicalRecord.diagnosis" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Kế hoạch điều trị</label>
        <textarea [(ngModel)]="medicalRecord.treatmentplan" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Lịch tái khám</label>
        <input type="date" [(ngModel)]="medicalRecord.nextappointment" min="{{today}}">
      </div>
      <div class="form-group">
        <label>Trạng thái hồ sơ</label>
        <select [(ngModel)]="medicalRecord.status" class="form-control">
          <option value="">Chọn trạng thái</option>
          <option *ngFor="let status of statusAppointments" [value]="status">
            {{status}}
          </option>
        </select>
      </div>
    </div>

    <div class="form-section">
      <h3>Đơn thuốc và dịch vụ</h3>

      <!-- Thuốc điều trị -->
      <div class="selection-group">
        <div class="selection-header">
          <h4>Thuốc điều trị</h4>
          <button class="btn btn-outline-primary" (click)="openMedicinePopup()">
            <i class="fas fa-plus"></i> Thêm thuốc
          </button>
        </div>
        <div class="selected-items">
          <div class="selected-item" *ngFor="let medicine of selectedMedicines">
            <span>{{medicine.name}} - {{medicine.unit}}</span>
            <button class="btn-remove" (click)="removeMedicine(medicine)">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Dịch vụ sử dụng -->
      <div class="selection-group">
        <div class="selection-header">
          <h4>Dịch vụ sử dụng</h4>
          <button class="btn btn-outline-primary" (click)="openServicePopup()">
            <i class="fas fa-plus"></i> Thêm dịch vụ
          </button>
        </div>
        <div class="selected-items">
          <div class="selected-item" *ngFor="let service of selectedServices">
            <span>{{service.name}}</span>
            <button class="btn-remove" (click)="removeService(service)">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Popup chọn thuốc -->
<div class="popup-overlay" *ngIf="showMedicinePopup">
  <div class="popup-content">
    <div class="popup-header">
      <h3>Chọn thuốc điều trị</h3>
      <div class="popup-actions">
        <button class="btn btn-outline-primary" (click)="openAddMedicineForm()">
          <i class="fas fa-plus"></i> Thêm thuốc mới
        </button>
        <button class="btn-close" (click)="closeMedicinePopup()">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <div class="popup-body">
      <div class="search-box">
        <input type="text"
               placeholder="Tìm kiếm thuốc..."
               [(ngModel)]="searchMedicineText">
        <i class="fas fa-search"></i>
      </div>
      <div class="items-list">
        <div class="item"
             *ngFor="let medicine of getFilteredMedicines()"
             [ngClass]="{'selected': isMedicineSelected(medicine)}"
             (click)="toggleMedicineSelection(medicine)">
          <span class="item-name">{{medicine.name}}</span>
          <span class="item-detail">{{medicine.unit}}</span>
          <i class="fas fa-check" *ngIf="isMedicineSelected(medicine)"></i>
        </div>
      </div>
    </div>
    <div class="popup-footer">
      <button class="btn btn-secondary" (click)="closeMedicinePopup()">Đóng</button>
    </div>
  </div>
</div>

<!-- Popup chọn dịch vụ -->
<div class="popup-overlay" *ngIf="showServicePopup">
  <div class="popup-content">
    <div class="popup-header">
      <h3>Chọn dịch vụ</h3>
      <button class="btn-close" (click)="closeServicePopup()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="popup-body">
      <div class="search-box">
        <input type="text"
               placeholder="Tìm kiếm dịch vụ..."
               [(ngModel)]="searchServiceText">
        <i class="fas fa-search"></i>
      </div>
      <div class="items-list">
        <div class="item"
             *ngFor="let service of getFilteredServices()"
             [ngClass]="{'selected': isServiceSelected(service)}"
             (click)="toggleServiceSelection(service)">
          <span class="item-name">{{service.name}}</span>
          <i class="fas fa-check" *ngIf="isServiceSelected(service)"></i>
        </div>
      </div>
    </div>
    <div class="popup-footer">
      <button class="btn btn-secondary" (click)="closeServicePopup()">Đóng</button>
    </div>
  </div>
</div>

<!-- Popup thêm thuốc mới -->
<div class="popup-overlay" *ngIf="showAddMedicineForm">
  <div class="popup-content">
    <div class="popup-header">
      <h3>Thêm thuốc mới</h3>
      <button class="btn-close" (click)="closeAddMedicineForm()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="popup-body">
      <form (ngSubmit)="submitNewMedicine()" #medicineForm="ngForm">
        <div class="form-group">
          <label>Tên thuốc</label>
          <input type="text" [(ngModel)]="newMedicine.name" name="name" required class="form-control">
        </div>
        <div class="form-group">
          <label>Đơn vị</label>
          <input type="text" [(ngModel)]="newMedicine.unit" name="unit" required class="form-control">
        </div>
      </form>
    </div>
    <div class="popup-footer">
      <button class="btn btn-secondary" (click)="closeAddMedicineForm()">Hủy</button>
      <button class="btn btn-primary" (click)="submitNewMedicine()" [disabled]="!medicineForm.form.valid">
        <i class="fas fa-save"></i> Lưu thuốc
      </button>
    </div>
  </div>
</div>
