<div class="forgot-password-container">
  <div class="forgot-password-card">
    <h2>Quên mật khẩu</h2>
    
    <div *ngIf="!isSubmitted" class="form-container">
      <p class="description">
        Vui lòng nhập địa chỉ email của bạn. Chúng tôi sẽ gửi một liên kết để đặt lại mật khẩu.
      </p>
      
      <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            #emailInput="ngModel"
            placeholder="Nhập email của bạn"
          />
          <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="error-message">
            <span *ngIf="emailInput.errors?.['required']">Email là bắt buộc</span>
            <span *ngIf="emailInput.errors?.['email']">Email không hợp lệ</span>
          </div>
        </div>

        <div class="button-group">
          <button 
            type="submit" 
            [disabled]="!forgotPasswordForm.form.valid || isLoading"
            class="submit-button"
          >
            <span *ngIf="isLoading" class="spinner"></span>
            <span *ngIf="!isLoading">Gửi yêu cầu</span>
          </button>
          
          <button 
            type="button" 
            (click)="goToLogin()"
            class="back-button"
          >
            Quay lại đăng nhập
          </button>
        </div>
      </form>
    </div>

    <div *ngIf="isSubmitted" class="success-message">
      <div class="success-icon">✓</div>
      <h3>Yêu cầu đã được gửi!</h3>
      <p>
        Chúng tôi đã gửi một email đến địa chỉ của bạn. 
        Vui lòng kiểm tra hộp thư và làm theo hướng dẫn để đặt lại mật khẩu.
      </p>
      <button (click)="goToLogin()" class="back-button">
        Quay lại đăng nhập
      </button>
    </div>
  </div>
</div>
