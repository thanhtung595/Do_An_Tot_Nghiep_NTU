<div class="admin-container">
  <!-- Sidebar (Header bên trái) -->
  <div class="sidebar">
    <div class="logo">
      <img src="https://cache.clinic.co/assets/img/logo.png" alt="Logo-Admin">
    </div>
    <nav class="menu">
      <ul>
        <li *ngFor="let header of headers">
        <a [href]="header.url"  (click)="onClickLogout(header, $event)" >{{ header.name }}</a>
      </li>
      </ul>
    </nav>
    <div class="back-to-home">
      <a href="/home">Back to home</a>
    </div>
  </div>
</div>
